name: Build HL-WR832-5G ROOter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prep Compilation Workspace
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          git clone https://github.com workspace
          
      - name: Inject Hardware Mappings and Switch Fallback
        run: |
          # 1. INJECT CUSTOM BOOT SETTINGS (LED & BUTTON MAPS)
          mkdir -p workspace/files/etc/board.d/
          cat << 'EOF' > workspace/files/etc/board.d/01_leds
          #!/bin/sh
          . /lib/functions/uci-defaults.sh
          board_config_update
          # Mapping system variables directly into UCI instead of broken source code patches
          ucidef_set_led_default "sys" "SYS" "green:sys" "1"
          ucidef_set_led_wlan "wlan2g" "WLAN2G" "green:wlan2g" "phy0radio"
          ucidef_set_led_wlan "wlan5g" "WLAN5G" "green:wlan5g" "phy1radio"
          board_config_commit
          exit 0
          EOF
          chmod +x workspace/files/etc/board.d/01_leds

          # 2. CREATE THE MODEM LTE POWER DAEMON FILE DIRECTLY
          mkdir -p workspace/files/etc/init.d/
          cat << 'EOF' > workspace/files/etc/init.d/99_lte_power
          #!/bin/sh /etc/rc.common
          START=10
          boot() {
              for pin in 8 9 10 11 20 34 35; do
                  if [ ! -d /sys/class/gpio/gpio$pin ]; then
                      echo $pin > /sys/class/gpio/export
                  fi
                  echo out > /sys/class/gpio/gpio$pin/direction
                  echo 1 > /sys/class/gpio/gpio$pin/value
              fi
          }
          EOF
          chmod +x workspace/files/etc/init.d/99_lte_power

          # 3. CREATE THE SAFE SWITCH FALLBACK DEFAULTS DIRECTLY
          cat << 'EOF' > workspace/files/etc/board.d/02_network
          #!/bin/sh
          . /lib/functions/uci-defaults.sh
          board_config_update
          board_create_network_switch "switch0" "" "1 2 3 4 5"
          ucidef_set_interface_lan "eth0"
          board_config_commit
          exit 0
          EOF
          chmod +x workspace/files/etc/board.d/02_network

      - name: Build Firmware Binary
        run: |
          cd workspace
          ./scripts/feeds update -a && ./scripts/feeds install -a
          # Build a clean configuration profile target for generic IPQ40xx
          echo "CONFIG_TARGET_ipq40xx=y" > .config
          echo "CONFIG_TARGET_ipq40xx_DEVICE_qcom_ipq4019=y" >> .config
          make defconfig
          make download
          make -j$(nproc)

      - name: Archive Flashable Image
        uses: actions/upload-artifact@v4
        with:
          name: hl-wr832-5g-firmware
          path: workspace/bin/targets/ipq40xx/
